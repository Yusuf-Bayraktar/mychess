[project]
name = "mychess"
version = "0.1.0"
description = "A desktop chess game with a Tkinter GUI, python-chess rules and a Stockfish opponent."
readme = "README.md"
license = "GPL-3.0-or-later"
license-files = ["LICENSE", "THIRD_PARTY_NOTICES.md"]
authors = [
    { name = "Yusuf Bayraktar", email = "yusufbayraktar2006@outlook.com" }
]
requires-python = ">=3.14"
dependencies = [
    "chess>=1.11.2",
    "pillow>=12.3.0",
]

[project.scripts]
mychess = "mychess:main"

[build-system]
requires = ["uv_build>=0.12.2,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "mypy>=2.4.0",
    "pyinstaller>=6.22.2",
    "pytest>=9.1.1",
    "ruff>=0.16.3",
]

[tool.mypy]
strict = true
files = ["src", "tests"]
# Testler, tests/ dizinindeki yardımcıları (fakes.py) üst düzey modül olarak içe aktarır.
mypy_path = "tests"

[tool.pytest.ini_options]
testpaths = ["tests"]
# Takılan bir test 60 sn sonra tüm thread'lerin traceback'ini döker.
faulthandler_timeout = 60
filterwarnings = [
    # python-chess 1.11, Python 3.14'te kullanımdan kalkan asyncio API'sini içe aktarıyor.
    "ignore:'asyncio.DefaultEventLoopPolicy' is deprecated:DeprecationWarning",
    "ignore:'asyncio.iscoroutinefunction' is deprecated:DeprecationWarning",
]
