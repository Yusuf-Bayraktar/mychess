name: CI

on:
  push:
  pull_request:

jobs:
  lint:
    name: Ruff + mypy
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10
      # Python sürümü .python-version'dan (3.14); uv'nin Python'unda tkinter var.
      - run: uv sync --managed-python --locked
      - run: uv run ruff check .
      - run: uv run mypy

  test:
    name: Testler (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10

      # Stockfish: gerçek motor testleri için (yoksa o testler atlanır).
      # Windows'ta repodaki engines/ altındaki .exe kullanılır.
      - name: Stockfish ve sanal ekran (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y stockfish xvfb
      - name: Stockfish (macOS)
        if: runner.os == 'macOS'
        run: brew install stockfish

      - run: uv sync --managed-python --locked

      # Tk testleri ekran ister; Linux'ta xvfb ile sanal ekran açılır.
      - name: pytest (Linux)
        if: runner.os == 'Linux'
        run: xvfb-run -a uv run pytest -v
      - name: pytest
        if: runner.os != 'Linux'
        run: uv run pytest -v
